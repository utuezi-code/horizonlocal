# Fallback Nixpacks config — used if Railway falls back from Dockerfile.
# Mirrors the Dockerfile behavior.
[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "postgresql"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
